name: Trusted submission review checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  metadata:
    name: Review submission metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only BASE policy is executed. Proposed code/workflows/manifests are data.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install trusted image parser
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - name: Validate data with the trusted base policy
        env:
          SUBMISSION_ACTOR: ${{ github.event.pull_request.user.login }}
          SUBMISSION_ACTOR_ID: ${{ github.event.pull_request.user.id }}
        run: /usr/bin/python3 policy/tools/validate.py --root proposed --base-tree policy --actor "$SUBMISSION_ACTOR" --actor-id "$SUBMISSION_ACTOR_ID"
      - name: Exercise admission and update boundaries from trusted policy
        run: /usr/bin/python3 policy/tests/test_submission.py
