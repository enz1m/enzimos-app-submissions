name: Check merged submission policy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    name: Check merged metadata and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - run: /usr/bin/python3 tools/validate.py --root .
      - run: /usr/bin/python3 tests/test_submission.py
